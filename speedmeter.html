<!DOCTYPE html>
<html>
    <head>
        <title>
            Geolocations
        </title>
        <style>
            *{
                padding:0px;
                margin:0px;
                box-sizing:border-box;
            }
            body{
                text-align:center;
                overflow:hidden;
                height:100vh;
                width:100%;
                display:flex;
                justify-content:center;
                align-items:Center;
                flex-direction: column;
                /* background-color:rgb(20, 19, 19); */
                background-color:black;
                color:white;
                position:relative;
                font-family:monospace;
            }
            .container{
                background-color:black;
                display:flex;
                align-items:end;
                width:100%;
                height:100%;
                position:relative;
            }
            .container>div{
               width:1px;
               background-color:black;
               box-shadow:0px 0px 22px 0.2px rgb(53, 50, 50);
               animation-name:pixel;
               animation-duration:1s;
               animation-iteration-count:1;
               animation-timing-function:linear;
               
            }
            /* @keyframes pixel{
                50%{
                    margin-bottom:100px;

                }
            } */
             .container>div:has(~*:hover){
                background-color:red;
                box-shadow:0px 0px 22px 0.2px red;
             }
             
           
           
           
        </style>
    </head>
    <body>
        <div class="container" id="container">
        </div>
        <script>
            
            let container = document.getElementById('container');
            for(i=0; i<=window.innerWidth; i++){
                console.log(i)
                let ele = document.createElement("div");
                ele.style.height = `calc(25vh + ${i/5}px)`;
                ele.style.animationDelay = i/200+"s";
                ele.style.animationDuration = i/20+"s";
                container.appendChild(ele);
            }
        </script>
    </body>
</html>
